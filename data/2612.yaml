        caption: "남편과 떠난 여행길, 산 정상에서 신발을 손에 들고 맨발로 걸어 내려오는 소녀들을 만났습니다. 유월인데도 건너편 산에는 아직 눈이 남아 있었습니다. 발이 아플 텐데도 저렇게 걷는 것을 보니, 영혼이 참 자유로운 아이들이구나 싶었습니다. 저 역시 맨발 걷기를 좋아하기에 그 발걸음이 더 가깝게 다가왔습니다."
