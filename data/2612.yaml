      - { label: "2026", text: "계룡문화원 전시" }
    cited:
      text: "저는 그분의 후손으로 살아가며, 그 숲에서 살아가는 법을 배웁니다. 자연을 소중하게 여기며 자신의 것을 나누어 공동체와 함께 살아가는 것, 그것이 바로 임창봉 선생님께서 삶으로 남기신 가르침입니다. 저는 임창봉님의 이름을 기억하는 사람으로 남고 싶지 않습니다. 그분의 마음과 철학을 실천하는 사람으로 살아가고 싶습니다. 그것이 진정한 '후손'의 길이라 믿습니다."
      source: "임재선, 「나의 삶, 그 빛과 그림자」, 『목원 '75 50주년 기념전』"
    statement: |
      제 사진은 대개 하늘을 올려다본 것입니다. 하늘을 보면 아버지를 뵙고 싶은 마음에 자꾸 위를 쳐다보게 됩니다.

      아버지가 나무를 심어 숲을 이루셨듯이, 카메라로 세상의 아름다움을 담으면서 제 삶에 또 다른 숲을 가꾸어 가는 것이 저의 꿈입니다.
    works:
      - no: 1
        title: "아버지의 숲"
        place: "대전 장태산"
        file: "ljs/01.jpg"
        ratio: "3:2"
        feature: true
        orig: "08_임재선_아버지의_숲.jpg"   # 원본 파일명(대조용)
        caption: |
          아버지 임창봉 선생은 1970년, 쉰 살에 이 일을 시작하셨습니다. 삼십 년 동안 돌을 쌓고 길을 내고 나무를 심으셨습니다. 어디에 무슨 나무를 둘지 미리 정해 두고, 수채화를 그리듯 한 그루씩 자리를 잡아 주셨습니다.

          2002년에 돌아가신 뒤로 저는 오랫동안 이 숲에 오지 못했습니다. 다시 걸어 들어오기까지 이십 년이 걸렸습니다.

          이날은 딸과 손녀가 함께 왔습니다. 손녀에게는 한 번도 뵌 적 없는 분입니다. 비문 앞에 서서 글자를 읽는 아이를 보며, 한 사람의 꿈이 여러 사람의 것이 되었다는 생각을 했습니다.
      - no: 2
        title: "나무의 간격"
        place: "대전 장태산"
        file: "ljs/02.jpg"
        ratio: "2:3"
        orig: "09_임재선_나무의_간격.jpg"   # 원본 파일명(대조용)
        caption: "잎을 다 떨군 겨울, 가지만 남은 메타세쿼이아를 올려다보았습니다. 서로 엉킨 가지가 하나도 없었습니다. 저마다 조금씩 거리를 두고, 자기가 빛을 더 받겠다고 하지 않고 옆 나무가 받도록 비켜 줍니다. 욕심부리지 않고 각자의 선을 넘지 않으면서 함께 사는 법을, 나무들은 이미 알고 있었습니다."
      - no: 3
        title: "나의 삶, 그 빛과 그림자"
        place: "대전 장태산"
        file: "ljs/03.jpg"
        ratio: "3:2"
        orig: "10_임재선_나의_삶_그_빛과_그림자.jpg"   # 원본 파일명(대조용)
        cited:
          text: |
            장태산 휴양림은 단지 나무가 많은 산이 아닙니다. 그곳에는 한 사람, 아니 한 가족의 신념과 땀, 인내 그리고 사랑이 고스란히 뿌리내리고 있습니다. 그분의 삶처럼 저도 누군가에게 작지만, 편안한 그늘이 되어 주는 사람이 되고 싶습니다.

            숲은 말이 없지만 많은 것을 가르쳐 줍니다. 참을성, 겸손함, 그리고 기다림, 그리고 무엇보다도 좋은 삶은 뿌리 깊은 나무처럼 조용히 묵묵히, 깊이 자란다는 것을요.
          source: "임재선, 「나의 삶, 그 빛과 그림자」, 『목원 '75 50주년 기념전』"
